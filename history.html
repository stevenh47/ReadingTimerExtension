<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>全部阅读历史记录</title>
<style>
  body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; background-color: #f4f7f9; }
  h1 { color: #3498db; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
  #history-display { margin-top: 20px; }
  .daily-summary-item { font-weight: bold; background-color: #ecf0f1; padding: 10px; margin-top: 15px; border-radius: 4px; border-left: 5px solid #3498db; }
  .session-list { list-style: none; padding-left: 20px; }
  .session-item { border-bottom: 1px dotted #ccc; padding: 5px 0; font-size: 0.9em; }
  .pagination { margin-top: 20px; text-align: center; }
  .pagination button { padding: 8px 15px; margin: 0 5px; cursor: pointer; border: 1px solid #ccc; background-color: white; border-radius: 4px; }
  .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
  <h1>📘 全部阅读历史记录</h1>
  <div id="history-display"></div>
  <div class="pagination">
    <button id="prev-btn" disabled>上一页</button>
    <span id="page-info"></span>
    <button id="next-btn" disabled>下一页</button>
  </div>
  <script src="history.js"></script>
</body>
</html>
