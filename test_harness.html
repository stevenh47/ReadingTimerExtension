<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>扩展程序手动测试页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            text-align: center;
            background-color: #f8f8f8;
        }
        h1 {
            color: #3498db;
        }
        .controls {
            margin-top: 30px;
        }
        .controls button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
            transition: background-color 0.2s;
        }
        #recordButton {
            background-color: #2ecc71; /* 绿色 */
        }
        #recordButton:hover {
            background-color: #27ae60;
        }
        #pauseRecordingButton {
            background-color: #f39c12; /* 橙色 */
        }
        #pauseRecordingButton:hover {
            background-color: #e67e22;
        }
        #stopRecordingButton {
            background-color: #e74c3c; /* 红色 */
        }
        #stopRecordingButton:hover {
            background-color: #c0392b;
        }
        
        /* 新增按钮样式 */
        #simulateSubmitButton {
            background-color: #8e44ad; /* 紫色 */
        }
        #simulateSubmitButton:hover {
            background-color: #9b59b6;
        }
        
        #status-message {
            margin-top: 30px;
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }

        .notes {
            margin-top: 50px;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            text-align: left;
        }
    </style>
</head>
<body>

    <h1>扩展程序手动测试页面</h1>

    <div class="controls" id="recording-controls">
        <button id="recordButton">开始 / 继续录音</button>
        <button id="pauseRecordingButton">暂停录音</button>
        <button id="stopRecordingButton">停止录音</button>
    </div>
    
    <div class="controls">
        <button id="simulateSubmitButton">模拟提交录音并停止计时</button>
    </div>
    
    <div id="status-message"></div>

    <div class="notes">
        <h2>测试说明：</h2>
        <ol>
            <li>本页面模拟了您孩子作业网站上的三个录音控制按钮。</li>
            <li>**“模拟提交”按钮**用于测试自动停止逻辑（在计时运行中点击）。</li>
        </ol>
    </div>

    <script>
        document.getElementById('simulateSubmitButton').addEventListener('click', function() {
            var controls = document.getElementById('recording-controls');
            var statusMessage = document.getElementById('status-message');
            
            // 1. 移除录音控制按钮
            controls.innerHTML = ''; 
            
            // 2. 显示 "Recording sent" 字符串 (必须与 content.js 中的 SUCCESS_STRING 匹配)
            statusMessage.textContent = 'Recording sent'; 

            alert("录音控制按钮已移除，并显示 'Recording sent'。请检查插件图标是否自动停止计时。");
        });
    </script>

</body>
</html>
